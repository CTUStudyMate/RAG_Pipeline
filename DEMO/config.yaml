chunk_config: "DEMO/config.yaml"
bge_embedding_model: "bge-m3:latest"
embedding_provider: "openai"
openai_embedding_model: "text-embedding-3-small"

llm_provider: "openai"
llm_model: "gpt-5-nano"

# common
max_pages_per_batch: 15
write_file_after_n_stream_elements: 100
write_file_after_max_stream_elements: 200
chunk_max_token: 600
chunk_min_token: 200
overlap_tokens: 80

image_token_estimate: 300
token_budget: 2000

####### store and debug ##################
chunk_from_atomic_test_filepath: "DEMO/debug_data/processed_atomics.json"
token_tree_test_filepath: "DEMO/debug_data/token_tree.json"
final_chunks_test_filepath: "DEMO/debug_data/final_chunks.json"
stream_elements_filepath: "DEMO/debug_data/processed_atomics.json"
tree_filepath: "DEMO/debug_data/tree.json"
chunking_time_log_file: "DEMO/logs/chunk_time.txt"
##########################################


pgdb:
  chunks_table: "hsf_3007_chunks_mini_effort"
  images_table: "hsf_3007_imgs_mini_effort"

vector_db_path: "DEMO/vectorchunks_storage"
vector_db_collection: "hsf_chunksize600"


vectordb_connect_info:
  db_path: "DEMO/vectorchunks_storage"
  collection: "hsf_chunksize600"

################################
log_file: "DEMO/logs/error.txt"
rrf_ranking_constant: 60
rrf_top_k: 20
vector_retrieve_chunks_limit: 30
text_retrieve_chunks_limit: 30
max_images_per_llmcall: 3
bm25_weight: 0.25
vector_weight: 0.75
